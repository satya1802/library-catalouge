    get:
      summary: Public distinct author/subject/availability values for browse filters.
      description: Public distinct author/subject/availability values for browse filters.
      operationId: get_api_facets
      parameters: []
      responses:
        '200':
          description: '200 { authors: [...], subjects: [...], availabilities: [...]
            }'
  /api/items:
    get:
      summary: Staff dashboard listing of records with search/filter to find a record
        to manage.
      description: Staff dashboard listing of records with search/filter to find a
        record to manage.
      operationId: get_api_items
      parameters: []
      responses:
        '200':
          description: '200 { results: [...], total }'
      security:
      - bearerAuth: []
    post:
      summary: Create an item record; validates required fields and upserts to Meilisearch.
      description: Create an item record; validates required fields and upserts to
