components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    staff_user:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        password_hash:
          type: string
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - is_active
      - created_at
    item:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        publisher:
          type: string
        publication_year:
          type: integer
        subject:
          type: string
        description:
          type: string
        shelf_location:
          type: string
        availability_status:
          type: string
        cover_image_key:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - author
      - availability_status
      - created_at
      - updated_at
