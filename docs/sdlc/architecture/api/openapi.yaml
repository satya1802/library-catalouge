            schema:
              type: object
              description: multipart file
      responses:
        '200':
          description: '200 { cover_url } | 400 { error: ''Unsupported image'' }'
      security:
      - bearerAuth: []
    delete:
      summary: Remove a cover image so the item falls back to the placeholder.
