paths:
  /api/auth/login:
    post:
      summary: Staff login with email/password; generic error on failure revealing
        neither field.
      description: Staff login with email/password; generic error on failure revealing
        neither field.
      operationId: post_api_auth_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{ email, password }'
      responses:
        '200':
          description: '200 session established | 401 { error: ''Invalid credentials''
            }'
  /api/auth/logout:
    post:
      summary: End the staff session so management pages require login again.
      description: End the staff session so management pages require login again.
      operationId: post_api_auth_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: none
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /api/auth/password-reset:
    post:
      summary: Request a password-reset email delivered via SMTP.
      description: Request a password-reset email delivered via SMTP.
      operationId: post_api_auth_password_reset
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{ email }'
      responses:
        '200':
          description: 202 accepted (always generic)
